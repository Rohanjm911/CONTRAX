version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contrax-backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql+asyncpg://contrax_user:contrax_secure_pw_2026@postgres:5432/contrax_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=contrax_prod_secret_key_very_long_change_me_2026
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: contrax-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    container_name: contrax-postgres
    restart: always
    environment:
      POSTGRES_USER: contrax_user
      POSTGRES_PASSWORD: contrax_secure_pw_2026
      POSTGRES_DB: contrax_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: contrax-redis
    restart: always
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
