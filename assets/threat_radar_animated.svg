<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="100%" height="330">
  <defs>
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090C12" />
      <stop offset="60%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#141B27" />
    </linearGradient>
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#00E5FF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </linearGradient>
    <filter id="blipGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes sweep360 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rippleExp {
      0% { r: 5px; opacity: 1; stroke-width: 2px; }
      100% { r: 24px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes barPulse {
      0%, 100% { transform: scaleX(0.96); }
      50% { transform: scaleX(1); }
    }
    .rotating-beam {
      transform-origin: 170px 165px;
      animation: sweep360 4.2s linear infinite;
    }
    .ripple-crit {
      animation: rippleExp 2s ease-out infinite;
    }
    .ripple-warn {
      animation: rippleExp 2.4s ease-out infinite 0.7s;
    }
  </style>

  <rect width="840" height="330" rx="14" fill="url(#hudBg)" stroke="#1F2B3E" stroke-width="1.2" />

  <g transform="translate(0, 0)">
    <circle cx="170" cy="165" r="135" fill="none" stroke="#17202E" stroke-width="1" />
    <circle cx="170" cy="165" r="105" fill="none" stroke="#1F2B3E" stroke-width="1" stroke-dasharray="3 5" />
    <circle cx="170" cy="165" r="70" fill="none" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.25" />
    <circle cx="170" cy="165" r="35" fill="none" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="170" cy="165" r="6" fill="#00E5FF" filter="url(#blipGlow)" />

    <line x1="35" y1="165" x2="305" y2="165" stroke="#1F2B3E" stroke-width="0.8" />
    <line x1="170" y1="30" x2="170" y2="300" stroke="#1F2B3E" stroke-width="0.8" />
    <line x1="75" y1="70" x2="265" y2="260" stroke="#17202E" stroke-width="0.6" stroke-dasharray="2 4" />
    <line x1="75" y1="260" x2="265" y2="70" stroke="#17202E" stroke-width="0.6" stroke-dasharray="2 4" />

    <text x="170" y="24" fill="#64748B" font-family="monospace" font-size="9" text-anchor="middle">000°</text>
    <text x="312" y="168" fill="#64748B" font-family="monospace" font-size="9">090°</text>
    <text x="170" y="312" fill="#64748B" font-family="monospace" font-size="9" text-anchor="middle">180°</text>
    <text x="18" y="168" fill="#64748B" font-family="monospace" font-size="9">270°</text>

    <g class="rotating-beam">
      <path d="M 170 165 L 305 165 A 135 135 0 0 0 265 69 Z" fill="url(#radarSweep)" />
      <line x1="170" y1="165" x2="305" y2="165" stroke="#00E5FF" stroke-width="1.8" filter="url(#blipGlow)" />
    </g>

    <g transform="translate(230, 110)">
      <circle cx="0" cy="0" r="5" fill="#EF4444" filter="url(#blipGlow)" />
      <circle cx="0" cy="0" r="5" fill="none" stroke="#EF4444" class="ripple-crit" />
      <text x="10" y="4" fill="#EF4444" font-family="monospace" font-size="10" font-weight="700">CRITICAL: Reentrancy</text>
    </g>

    <g transform="translate(110, 95)">
      <circle cx="0" cy="0" r="4.5" fill="#F59E0B" filter="url(#blipGlow)" />
      <circle cx="0" cy="0" r="4.5" fill="none" stroke="#F59E0B" class="ripple-warn" />
      <text x="-105" y="4" fill="#F59E0B" font-family="monospace" font-size="10" font-weight="700">HIGH: tx.origin</text>
    </g>

    <g transform="translate(210, 220)">
      <circle cx="0" cy="0" r="4" fill="#F59E0B" filter="url(#blipGlow)" />
      <text x="10" y="4" fill="#F59E0B" font-family="monospace" font-size="9.5" font-weight="600">HIGH: Unchecked Call</text>
    </g>

    <g transform="translate(130, 240)">
      <circle cx="0" cy="0" r="3.5" fill="#00E5FF" filter="url(#blipGlow)" />
      <text x="-95" y="4" fill="#00E5FF" font-family="monospace" font-size="9.5" font-weight="600">MED: Gas Loop</text>
    </g>
  </g>

  <g transform="translate(420, 25)">
    <rect x="0" y="0" width="395" height="280" rx="10" fill="#0B0F17" stroke="#1F2B3E" stroke-width="1" />

    <text x="20" y="28" fill="#F3F6FA" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">DETECTION TELEMETRY</text>
    <rect x="250" y="14" width="125" height="20" rx="4" fill="#07242E" stroke="#0D4B5C" stroke-width="0.8" />
    <text x="258" y="28" fill="#00E5FF" font-family="monospace" font-size="10" font-weight="700">● LIVE RUNNER</text>

    <g transform="translate(20, 50)">
      <text x="0" y="14" fill="#94A3B8" font-family="monospace" font-size="11">SWC-107 Reentrancy (State violation)</text>
      <text x="310" y="14" fill="#EF4444" font-family="monospace" font-size="11" font-weight="700">CRITICAL</text>
      <rect x="0" y="22" width="355" height="6" rx="3" fill="#17202E" />
      <rect x="0" y="22" width="355" height="6" rx="3" fill="#EF4444" />
    </g>

    <g transform="translate(20, 95)">
      <text x="0" y="14" fill="#94A3B8" font-family="monospace" font-size="11">SWC-115 Authorization via tx.origin</text>
      <text x="325" y="14" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="700">HIGH</text>
      <rect x="0" y="22" width="355" height="6" rx="3" fill="#17202E" />
      <rect x="0" y="22" width="280" height="6" rx="3" fill="#F59E0B" />
    </g>

    <g transform="translate(20, 140)">
      <text x="0" y="14" fill="#94A3B8" font-family="monospace" font-size="11">SWC-104 Unchecked Low-Level Call</text>
      <text x="325" y="14" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="700">HIGH</text>
      <rect x="0" y="22" width="355" height="6" rx="3" fill="#17202E" />
      <rect x="0" y="22" width="220" height="6" rx="3" fill="#F59E0B" />
    </g>

    <g transform="translate(20, 185)">
      <text x="0" y="14" fill="#94A3B8" font-family="monospace" font-size="11">EVM SSTORE High Storage Write Loops</text>
      <text x="315" y="14" fill="#00E5FF" font-family="monospace" font-size="11" font-weight="700">MEDIUM</text>
      <rect x="0" y="22" width="355" height="6" rx="3" fill="#17202E" />
      <rect x="0" y="22" width="165" height="6" rx="3" fill="#00E5FF" />
    </g>

    <g transform="translate(20, 235)">
      <rect x="0" y="0" width="170" height="30" rx="6" fill="#111722" stroke="#1F2B3E" stroke-width="0.8" />
      <text x="12" y="19" fill="#94A3B8" font-family="monospace" font-size="10.5">Execution: <tspan fill="#00E5FF" font-weight="700">1.19s</tspan></text>

      <rect x="185" y="0" width="170" height="30" rx="6" fill="#07242E" stroke="#0D4B5C" stroke-width="0.8" />
      <text x="197" y="19" fill="#94A3B8" font-family="monospace" font-size="10.5">Score: <tspan fill="#00E5FF" font-weight="700">92 / 100</tspan></text>
    </g>
  </g>
</svg>
