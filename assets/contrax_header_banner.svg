<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B10" />
      <stop offset="50%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#111722" />
    </linearGradient>
    <linearGradient id="cyanAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#00E5FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1F2B3E" stroke-width="0.7" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <style>
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulseFade {
      0% { opacity: 0.15; transform: scale(0.96); }
      50% { opacity: 0.95; transform: scale(1.04); }
      100% { opacity: 0.15; transform: scale(0.96); }
    }
    @keyframes blipPulsar {
      0% { r: 3px; opacity: 1; }
      70% { r: 10px; opacity: 0; }
      100% { r: 3px; opacity: 0; }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes circuitFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    .sweep-beam {
      transform-origin: 140px 140px;
      animation: radarSpin 4s linear infinite;
    }
    .cursor-blink {
      animation: blinkCursor 0.9s infinite;
    }
    .circuit-pulse {
      stroke-dasharray: 10 15;
      animation: circuitFlow 3s linear infinite;
    }
    .pulse-ring-1 {
      transform-origin: 140px 140px;
      animation: pulseFade 2.6s ease-in-out infinite;
    }
  </style>

  <rect width="1000" height="280" rx="16" fill="url(#bgGrad)" stroke="#1F2B3E" stroke-width="1.5" />
  <rect width="1000" height="280" rx="16" fill="url(#grid)" />

  <path d="M 0 40 L 400 40 L 440 80 L 1000 80" fill="none" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.25" class="circuit-pulse" />
  <path d="M 0 240 L 600 240 L 640 200 L 1000 200" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.25" class="circuit-pulse" />

  <g transform="translate(10, 0)">
    <circle cx="140" cy="140" r="110" fill="none" stroke="#17202E" stroke-width="1.5" />
    <circle cx="140" cy="140" r="85" fill="none" stroke="#1F2B3E" stroke-width="1.2" stroke-dasharray="4 6" />
    <circle cx="140" cy="140" r="60" fill="none" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.3" />
    <circle cx="140" cy="140" r="35" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.6" class="pulse-ring-1" />
    <circle cx="140" cy="140" r="10" fill="#00E5FF" fill-opacity="0.2" stroke="#00E5FF" stroke-width="1.5" />

    <line x1="30" y1="140" x2="250" y2="140" stroke="#1F2B3E" stroke-width="1" stroke-opacity="0.6" />
    <line x1="140" y1="30" x2="140" y2="250" stroke="#1F2B3E" stroke-width="1" stroke-opacity="0.6" />

    <g class="sweep-beam">
      <path d="M 140 140 L 250 140 A 110 110 0 0 0 217 62 Z" fill="url(#sweepGrad)" />
      <line x1="140" y1="140" x2="250" y2="140" stroke="#00E5FF" stroke-width="2" filter="url(#cyanGlow)" />
    </g>

    <circle cx="185" cy="105" r="4" fill="#EF4444" filter="url(#amberGlow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="185" cy="105" r="4" fill="none" stroke="#EF4444" stroke-width="1.5">
      <animate attributeName="r" values="4;14;18" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0.2;0" dur="1.8s" repeatCount="indefinite" />
    </circle>

    <circle cx="110" cy="180" r="3.5" fill="#F59E0B">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="85" cy="115" r="3.5" fill="#00E5FF">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <g transform="translate(295, 38)">
    <!-- Header Badges -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="138" height="22" rx="4" fill="#07242E" stroke="#0D4B5C" stroke-width="1" />
      <circle cx="10" cy="11" r="3.5" fill="#00E5FF" filter="url(#cyanGlow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite" />
      </circle>
      <text x="20" y="15" fill="#00E5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="700" letter-spacing="1">RADAR v2.0 ACTIVE</text>
    </g>

    <g transform="translate(148, 0)">
      <rect x="0" y="0" width="154" height="22" rx="4" fill="#1C1808" stroke="#5A3F0E" stroke-width="1" />
      <circle cx="10" cy="11" r="3.5" fill="#F59E0B" filter="url(#amberGlow)" />
      <text x="20" y="15" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="700" letter-spacing="1">EVM AUDITOR GRADE</text>
    </g>

    <g transform="translate(312, 0)">
      <rect x="0" y="0" width="156" height="22" rx="4" fill="#111722" stroke="#1F2B3E" stroke-width="1" />
      <circle cx="10" cy="11" r="3.5" fill="#38BDF8" />
      <text x="20" y="15" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="600" letter-spacing="0.5">MULTI-ENGINE PIPELINE</text>
    </g>

    <!-- Main Title & Subtitle with Hairline Separator -->
    <g transform="translate(0, 36)">
      <!-- Main Brand Logo Text -->
      <text x="0" y="44" fill="url(#cyanAmber)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="38" font-weight="900" letter-spacing="2" filter="url(#cyanGlow)">CONTRAX</text>

      <!-- Sleek Vertical Separator -->
      <line x1="216" y1="12" x2="216" y2="48" stroke="#293B54" stroke-width="1.5" />

      <!-- Subtitle & Taxonomy Hierarchy -->
      <text x="232" y="27" fill="#F3F6FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" letter-spacing="0.3">Automated Smart Contract Vulnerability Scanner</text>
      <text x="232" y="46" fill="#00E5FF" font-family="Consolas, 'Fira Code', Monaco, monospace" font-size="10.5" font-weight="600" letter-spacing="1">TACTICAL AUDIT WORKBENCH // MULTI-ENGINE PIPELINE</text>
    </g>

    <!-- Execution Engine Pipeline Status Bar -->
    <g transform="translate(0, 115)">
      <rect x="0" y="0" width="670" height="34" rx="6" fill="#0B0F17" stroke="#1F2B3E" stroke-width="1" />
      <text x="14" y="22" fill="#00E5FF" font-family="Consolas, 'Fira Code', Monaco, monospace" font-size="13" font-weight="700">&gt;</text>
      <text x="32" y="22" fill="#F3F6FA" font-family="Consolas, 'Fira Code', Monaco, monospace" font-size="12" font-weight="500">AST Semantic Pass</text>
      <text x="175" y="22" fill="#64748B" font-family="Consolas, monospace" font-size="12">•</text>
      <text x="195" y="22" fill="#F3F6FA" font-family="Consolas, 'Fira Code', Monaco, monospace" font-size="12" font-weight="500">Slither Detectors</text>
      <text x="330" y="22" fill="#64748B" font-family="Consolas, monospace" font-size="12">•</text>
      <text x="350" y="22" fill="#F3F6FA" font-family="Consolas, 'Fira Code', Monaco, monospace" font-size="12" font-weight="500">Mythril Symbolic</text>
      <text x="490" y="22" fill="#64748B" font-family="Consolas, monospace" font-size="12">•</text>
      <text x="510" y="22" fill="#F59E0B" font-family="Consolas, 'Fira Code', Monaco, monospace" font-size="12" font-weight="600">EVM Gas Profiler</text>
      <rect x="645" y="10" width="8" height="15" fill="#00E5FF" class="cursor-blink" />
    </g>

    <!-- Telemetry Footer Note -->
    <g transform="translate(0, 168)">
      <text x="0" y="14" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-style="italic">"See the flaw before they do."</text>
      <text x="345" y="14" fill="#64748B" font-family="Consolas, Monaco, monospace" font-size="10.5">0-100 Threat Posture • SWC Registry • PDF / JSON Export</text>
    </g>
  </g>
</svg>
